<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAR - 登录</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 11.586l4.95-4.95 1.414 1.414L13.414 13l4.95 4.95-1.414 1.414L12 12.97l-4.95 4.95-1.414-1.414L10.586 13 5.636 8.05l1.414-1.414L12 11.586z"/>
      </svg>
    </div>
    <h1 class="title">SAR-抗干扰</h1>
    <p class="subtitle">登录您的账户以开始使用</p>
    <p class="login-error" id="loginError">邮箱或密码错误，请重试</p>
    <div class="form-group">
      <label for="email">邮箱</label>
      <input type="email" id="email" placeholder="your@email.com" value="test@123.com">
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="••••••••" value="123456">
    </div>
    <button class="login-btn" id="loginBtn">登录</button>
    <a href="index.html" class="back-link">返回激活验证</a>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
